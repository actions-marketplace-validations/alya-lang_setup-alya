name: Test setup-alya

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ['latest', '0.0.16']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler (${{ matrix.version }})
        id: alya
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify alyac executable on PATH
        run: |
          alyac --version

      - name: Check action outputs
        shell: bash
        run: |
          echo "Output version: ${{ steps.alya.outputs.version }}"
          echo "Output path:    ${{ steps.alya.outputs.alyac-path }}"
          test -n "${{ steps.alya.outputs.version }}"
          test -n "${{ steps.alya.outputs.alyac-path }}"

      - name: Test simple Alya execution
        shell: bash
        run: |
          echo 'say "Hello from setup-alya CI!"' > hello.alya
          alyac run hello.alya
